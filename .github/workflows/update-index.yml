name: Actualizare index produse
on:
  schedule:
    - cron: "17 * * * *"   # la fiecare ora (produse noi); stocul vine din worker la 2-4 minute
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descarca catalogele
        run: |
          mkdir -p data
          curl -sSf --retry 3 -o data/so_feed.xml https://www.suplimenteoriginale.ro/feed/googleShoppingAds.xml
          python3 - <<'E'
          import json, time, urllib.request, urllib.error
          def get(url):
              for t in range(6):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      return json.load(urllib.request.urlopen(req, timeout=60))
                  except urllib.error.HTTPError as e:
                      if e.code not in (429, 500, 502, 503) or t == 5: raise
                      time.sleep(int(e.headers.get("Retry-After") or 0) or 10 * (t + 1))
          allp = []
          try:
              for page in range(1, 40):
                  d = get(f"https://provitamine.ro/products.json?limit=250&page={page}")["products"]
                  time.sleep(1)
                  if not d: break
                  allp += d
              json.dump(allp, open("data/pv_products.json", "w"))
              print(len(allp), "produse PV")
          except Exception as e:
              # Shopify refuza temporar (429): pastram catalogul PV deja publicat, restul se publica normal
              print("::warning::Catalog PV indisponibil (", e, "), se pastreaza indexul PV publicat")
              open("data/pv_failed", "w").write(str(e))
          E
      - name: Construieste indexul
        run: |
          pip install -q snowballstemmer
          mkdir -p dist/so dist/pv
          python3 build/build_index.py so data/so_feed.xml dist/so/index.json
          python3 build/build_search.py so data/so_feed.xml dist/so
          if [ -f data/pv_failed ]; then
            for f in index.json search.json desc.json; do
              curl -sSf --retry 3 -o dist/pv/$f "https://suplimenteoriginale-stack.github.io/cautare-launcher/pv/$f"
            done
          else
            python3 build/build_index.py pv data/pv_products.json dist/pv/index.json data/pv_ratings.json
            python3 build/build_search.py pv data/pv_products.json dist/pv
          fi
          python3 build/build_config.py so
          python3 build/build_config.py pv
          python3 build/bundle.py
          mkdir -p dist/assets && cp -r assets/banners assets/logos dist/assets/ && cp src/test_so.html src/test_pv.html dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
